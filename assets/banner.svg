<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0d14;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="1.2" fill="#334155" fill-opacity="0.6"/>
    </pattern>

    <!-- Filter for subtle drop-shadow on foreground text -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Style Definitions for Animation -->
  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes flowHorizontal {
      0% { transform: translateX(0); }
      100% { transform: translateX(-600px); }
    }
    @keyframes streamData {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      50% { stroke-dashoffset: 0; opacity: 0.8; }
      100% { stroke-dashoffset: -400; opacity: 0.2; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillDelayed {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(7px); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .orb-1 { animation: pulseOrb 9s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 12s ease-in-out infinite alternate; transform-origin: 1000px 250px; }
    .data-wire { stroke-dasharray: 12 18; animation: streamData 6s linear infinite; }
    .data-wire-fast { stroke-dasharray: 8 14; animation: streamData 3.5s linear infinite; }
    .pill-floating-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-floating-2 { animation: floatPillDelayed 6s ease-in-out infinite; }
    .radar { transform-origin: 1040px 180px; animation: radarSweep 14s linear infinite; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- Subtle Animated Glow Orbs in Deep Background -->
  <circle class="orb-1" cx="220" cy="110" r="180" fill="url(#glowGrad1)"/>
  <circle class="orb-2" cx="980" cy="240" r="220" fill="url(#glowGrad2)"/>

  <!-- Matrix / Cyber Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Background Animated Data Stream Rays (Kept behind texts) -->
  <g opacity="0.45">
    <path class="data-wire" d="M -50,60 Q 300,140 600,50 T 1250,90" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <path class="data-wire-fast" d="M -50,310 Q 350,220 700,290 T 1250,260" fill="none" stroke="#a855f7" stroke-width="1.8"/>
    <path class="data-wire" d="M 100,-20 L 250,380" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="6 6"/>
    <path class="data-wire" d="M 1050,-20 L 950,380" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="6 6"/>
  </g>

  <!-- Decorative Tech Graphic (Right Side Cyber Node / Radar) -->
  <g opacity="0.35">
    <circle cx="1040" cy="180" r="90" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="1040" cy="180" r="60" fill="none" stroke="#475569" stroke-width="1"/>
    <circle cx="1040" cy="180" r="30" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line class="radar" x1="1040" y1="180" x2="1130" y2="180" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="1040" cy="180" r="4" fill="#38bdf8"/>
  </g>

  <!-- Left Side Floating Tech Badges (Dynamic/Animated Pills, strictly below main text z-plane) -->
  <g class="pill-floating-1" filter="url(#pillShadow)" opacity="0.85">
    <rect x="70" y="38" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="85" cy="52" r="4" fill="#22c55e"/>
    <text x="97" y="57" fill="#cbd5e1" font-size="11" font-weight="600">LIVE ENDPOINTS</text>
  </g>

  <g class="pill-floating-2" filter="url(#pillShadow)" opacity="0.85">
    <rect x="1000" y="44" width="130" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <circle cx="1015" cy="58" r="4" fill="#38bdf8"/>
    <text x="1027" y="63" fill="#cbd5e1" font-size="11" font-weight="600">RESIDENTIAL IPs</text>
  </g>

  <!-- MAIN FOREGROUND TITLE & BRANDING (High Contrast, Bold, Guaranteed Foreground) -->
  <g filter="url(#textShadow)">
    <!-- Small Category Eyebrow Badge -->
    <g transform="translate(60, 95)">
      <rect x="0" y="0" width="375" height="26" rx="13" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <text x="14" y="17" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.2">⚡ CURATED ECOSYSTEM &amp; RADAR</text>
      <text x="210" y="17" fill="#94a3b8" font-size="11" font-weight="500">| REST APIs • OSINT • PYTHON</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="175" fill="url(#primaryTextGrad)" font-size="44" font-weight="900" letter-spacing="-0.8">
      Awesome Social Media Scraping API
    </text>

    <!-- Main Subtitle -->
    <text x="60" y="215" fill="#f8fafc" font-size="19" font-weight="600" letter-spacing="-0.2">
      Enterprise SaaS Data APIs &amp; High-Performance Open-Source Scrapers
    </text>

    <!-- Supporting Narrative / Tagline -->
    <text x="60" y="246" fill="#94a3b8" font-size="14" font-weight="400">
      Extract structured posts, profiles, metrics &amp; media from X, Instagram, TikTok, YouTube, Reddit &amp; LinkedIn.
    </text>
  </g>

  <!-- Interactive Platform Category Pills in Foreground Footer -->
  <g transform="translate(60, 282)">
    <!-- Pill 1 -->
    <g filter="url(#pillShadow)">
      <rect x="0" y="0" width="105" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="52" y="22" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle">𝕏 Twitter / X</text>
    </g>

    <!-- Pill 2 -->
    <g filter="url(#pillShadow)" transform="translate(117, 0)">
      <rect x="0" y="0" width="105" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2"/>
      <text x="52" y="22" fill="#f472b6" font-size="12" font-weight="700" text-anchor="middle">📸 Instagram</text>
    </g>

    <!-- Pill 3 -->
    <g filter="url(#pillShadow)" transform="translate(234, 0)">
      <rect x="0" y="0" width="95" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="47" y="22" fill="#67e8f9" font-size="12" font-weight="700" text-anchor="middle">🎵 TikTok</text>
    </g>

    <!-- Pill 4 -->
    <g filter="url(#pillShadow)" transform="translate(341, 0)">
      <rect x="0" y="0" width="100" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.2"/>
      <text x="50" y="22" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">▶️ YouTube</text>
    </g>

    <!-- Pill 5 -->
    <g filter="url(#pillShadow)" transform="translate(453, 0)">
      <rect x="0" y="0" width="90" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#f97316" stroke-width="1.2"/>
      <text x="45" y="22" fill="#fdba74" font-size="12" font-weight="700" text-anchor="middle">🤖 Reddit</text>
    </g>

    <!-- Pill 6 -->
    <g filter="url(#pillShadow)" transform="translate(555, 0)">
      <rect x="0" y="0" width="95" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#0284c7" stroke-width="1.2"/>
      <text x="47" y="22" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">💼 LinkedIn</text>
    </g>

    <!-- Pill 7 -->
    <g filter="url(#pillShadow)" transform="translate(662, 0)">
      <rect x="0" y="0" width="115" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2"/>
      <text x="57" y="22" fill="#c7d2fe" font-size="12" font-weight="700" text-anchor="middle">🦋 Bluesky / AT</text>
    </g>

    <!-- Pill 8 -->
    <g filter="url(#pillShadow)" transform="translate(789, 0)">
      <rect x="0" y="0" width="110" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2"/>
      <text x="55" y="22" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">🕵️ OSINT Feed</text>
    </g>
  </g>

  <!-- Sleek Top & Bottom Border Accents -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#primaryTextGrad)"/>
  <rect x="0" y="358" width="1200" height="2" fill="#1e293b"/>
</svg>
